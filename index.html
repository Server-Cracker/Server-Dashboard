<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Dashboard</title>
<style>
  :root {
    --bg: #0e1117;
    --card: #161b22;
    --border: #262c36;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .card-label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .card-value {
    font-size: 22px;
    font-weight: 600;
  }
  .card-sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
  .bar-track {
    background: #21262d;
    border-radius: 6px;
    height: 8px;
    margin-top: 10px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .section-title {
    font-size: 14px;
    color: var(--muted);
    margin: 20px 0 10px 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .service-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .service-row.highlighted {
    border-color: var(--accent);
  }
  .service-name {
    font-weight: 600;
    font-size: 14px;
  }
  .service-image {
    color: var(--muted);
    font-size: 12px;
  }
  .status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 8px;
  }
  .status-dot.up { background: var(--green); }
  .status-dot.down { background: var(--red); }
  .status-text {
    font-size: 12px;
    color: var(--muted);
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  button {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #restartBtn { background: var(--yellow); color: #1a1300; }
  #shutdownBtn { background: var(--red); color: #2a0000; }
  .error-banner {
    background: #3d1b1b;
    border: 1px solid var(--red);
    color: #ffb3ab;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }
  .token-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .token-row input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .token-row button {
    flex: none;
    padding: 10px 16px;
    background: var(--accent);
    color: #001a33;
  }
  .last-updated {
    color: var(--muted);
    font-size: 11px;
    text-align: right;
    margin-top: 16px;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: min(320px, 90%);
    text-align: center;
  }
  .modal p { font-size: 14px; color: var(--muted); }
  .modal .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
  .modal .cancel { background: #21262d; color: var(--text); }
</style>
</head>
<body>

<h1>🖥️ Server Dashboard</h1>
<div class="subtitle" id="uptimeLine">loading…</div>

<div class="error-banner" id="errorBanner"></div>

<div class="card" id="healthCard" style="margin-bottom:16px; border-color:var(--green);">
  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div>
      <div class="card-label">Overall Health</div>
      <div class="card-value" id="healthStatus">Checking…</div>
      <div class="card-sub" id="healthReasons"></div>
    </div>
    <div id="healthIcon" style="font-size:32px;">⏳</div>
  </div>
</div>

<div class="token-row">
  <input type="password" id="tokenInput" placeholder="Dashboard token (for shutdown/restart)">
  <button onclick="saveToken()">Save</button>
</div>

<div class="grid">
  <div class="card">
    <div class="card-label">CPU</div>
    <div class="card-value" id="cpuVal">–%</div>
    <div class="card-sub" id="cpuSub">load: –</div>
    <div class="bar-track"><div class="bar-fill" id="cpuBar" style="width:0%; background:var(--accent);"></div></div>
  </div>
  <div class="card">
    <div class="card-label">RAM</div>
    <div class="card-value" id="ramVal">–%</div>
    <div class="card-sub" id="ramSub">– / – GB</div>
    <div class="bar-track"><div class="bar-fill" id="ramBar" style="width:0%; background:var(--green);"></div></div>
  </div>
  <div class="card">
    <div class="card-label">Storage</div>
    <div class="card-value" id="diskVal">–%</div>
    <div class="card-sub" id="diskSub">– / – GB</div>
    <div class="bar-track"><div class="bar-fill" id="diskBar" style="width:0%; background:var(--yellow);"></div></div>
  </div>
</div>

<div class="section-title">Docker & Services</div>
<div id="serviceList">
  <div class="service-row"><span class="status-text">loading…</span></div>
</div>

<div class="controls">
  <button id="restartBtn" onclick="confirmAction('restart')">🔄 Restart Server</button>
  <button id="shutdownBtn" onclick="confirmAction('shutdown')">⏻ Shutdown Server</button>
</div>

<div class="last-updated" id="lastUpdated"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Are you sure?</h3>
    <p id="modalText"></p>
    <div id="countdownText" style="font-size:28px; font-weight:700; margin-top:10px; display:none;"></div>
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button id="modalConfirmBtn" style="background:var(--red); color:#2a0000;">Confirm</button>
    </div>
  </div>
</div>

<script>
let pendingAction = null;

function getToken() {
  return localStorage.getItem('dashboard_token') || '';
}
function saveToken() {
  const v = document.getElementById('tokenInput').value.trim();
  if (v) {
    localStorage.setItem('dashboard_token', v);
    document.getElementById('tokenInput').value = '';
    document.getElementById('tokenInput').placeholder = 'Token saved ✓';
  }
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.textContent = msg;
  el.style.display = 'block';
}
function clearError() {
  document.getElementById('errorBanner').style.display = 'none';
}

let lastHealth = null;

function renderHealth(health) {
  lastHealth = health;
  applyHealthDisplay();
}

function applyHealthDisplay() {
  if (!lastHealth) return;
  const statusMap = {
    healthy: { label: 'Healthy', color: 'var(--green)', icon: '✅' },
    warning: { label: 'Warning', color: 'var(--yellow)', icon: '⚠️' },
    critical: { label: 'Critical', color: 'var(--red)', icon: '🔴' }
  };
  const s = statusMap[lastHealth.status] || statusMap.healthy;
  document.getElementById('healthCard').style.borderColor = s.color;
  document.getElementById('healthStatus').textContent = s.label;
  document.getElementById('healthStatus').style.color = s.color;
  document.getElementById('healthIcon').textContent = s.icon;
  document.getElementById('healthReasons').textContent =
    lastHealth.reasons && lastHealth.reasons.length ? lastHealth.reasons.join(' · ') : 'All systems normal';
}

function escalateHealthForDownContainers(containers) {
  if (!lastHealth) return;
  const downHighlighted = containers.filter(c => c.highlighted && !c.running);
  if (downHighlighted.length) {
    lastHealth = {
      status: 'critical',
      reasons: [...(lastHealth.reasons || []), ...downHighlighted.map(c => `${c.name} is down`)],
      checks: lastHealth.checks
    };
    applyHealthDisplay();
  }
}

function fmtUptime(seconds) {
  const d = Math.floor(seconds / 86400);
  const h = Math.floor((seconds % 86400) / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return `Uptime: ${d}d ${h}h ${m}m`;
}

function barColor(percent) {
  if (percent >= 90) return 'var(--red)';
  if (percent >= 70) return 'var(--yellow)';
  return 'var(--green)';
}

async function refreshStatus() {
  try {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error('status endpoint failed');
    const d = await res.json();
    clearError();

    document.getElementById('cpuVal').textContent = d.cpu_percent.toFixed(1) + '%';
    document.getElementById('cpuSub').textContent =
      `load: ${d.load_avg['1m']}, ${d.load_avg['5m']}, ${d.load_avg['15m']}` +
      (d.cpu_temp_c ? ` · ${d.cpu_temp_c.toFixed(0)}°C` : '');
    document.getElementById('cpuBar').style.width = d.cpu_percent + '%';
    document.getElementById('cpuBar').style.background = barColor(d.cpu_percent);

    document.getElementById('ramVal').textContent = d.memory.percent.toFixed(1) + '%';
    document.getElementById('ramSub').textContent = `${d.memory.used_gb} / ${d.memory.total_gb} GB`;
    document.getElementById('ramBar').style.width = d.memory.percent + '%';
    document.getElementById('ramBar').style.background = barColor(d.memory.percent);

    document.getElementById('diskVal').textContent = d.disk.percent.toFixed(1) + '%';
    document.getElementById('diskSub').textContent = `${d.disk.used_gb} / ${d.disk.total_gb} GB`;
    document.getElementById('diskBar').style.width = d.disk.percent + '%';
    document.getElementById('diskBar').style.background = barColor(d.disk.percent);

    document.getElementById('uptimeLine').textContent = fmtUptime(d.uptime_seconds);
    renderHealth(d.health);
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    showError('Could not reach dashboard backend. Is app.py running?');
  }
}

async function refreshDocker() {
  const list = document.getElementById('serviceList');
  try {
    const res = await fetch('/api/docker');
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    if (!d.containers.length) {
      list.innerHTML = '<div class="service-row"><span class="status-text">No containers found</span></div>';
      return;
    }
    list.innerHTML = d.containers.map(c => `
      <div class="service-row ${c.highlighted ? 'highlighted' : ''}">
        <div>
          <div class="service-name"><span class="status-dot ${c.running ? 'up' : 'down'}"></span>${c.name}</div>
          <div class="service-image">${c.image}</div>
        </div>
        <div class="status-text">${c.status}</div>
      </div>
    `).join('');
    escalateHealthForDownContainers(d.containers);
  } catch (e) {
    list.innerHTML = `<div class="service-row"><span class="status-text">Docker check failed: ${e.message}</span></div>`;
  }
}

function confirmAction(action) {
  pendingAction = action;
  const titleMap = { shutdown: 'Shutdown server?', restart: 'Restart server?' };
  const textMap = {
    shutdown: 'This will power off the server. You will need physical/remote access to turn it back on.',
    restart: 'This will reboot the server. It will be unreachable for a minute or two.'
  };
  document.getElementById('modalTitle').textContent = titleMap[action];
  document.getElementById('modalText').textContent = textMap[action];
  document.getElementById('modalText').style.display = 'block';
  document.getElementById('countdownText').style.display = 'none';
  document.getElementById('modalConfirmBtn').textContent = 'Confirm';
  document.getElementById('modalConfirmBtn').disabled = false;
  document.getElementById('modalOverlay').classList.add('open');
}

let countdownInterval = null;

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  pendingAction = null;
  if (countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
}

document.getElementById('modalConfirmBtn').addEventListener('click', () => {
  if (!pendingAction || countdownInterval) return;
  const action = pendingAction;

  document.getElementById('modalText').style.display = 'none';
  document.getElementById('countdownText').style.display = 'block';
  document.getElementById('modalConfirmBtn').disabled = true;

  let secondsLeft = 10;
  document.getElementById('countdownText').textContent = secondsLeft;

  countdownInterval = setInterval(async () => {
    secondsLeft -= 1;
    document.getElementById('countdownText').textContent = secondsLeft;
    if (secondsLeft <= 0) {
      clearInterval(countdownInterval);
      countdownInterval = null;
      closeModal();
      try {
        const res = await fetch('/api/' + action, {
          method: 'POST',
          headers: { 'X-Auth-Token': getToken() }
        });
        const d = await res.json();
        if (!res.ok) {
          showError(d.error === 'unauthorized' ? 'Wrong or missing token — enter it above.' : d.error);
          return;
        }
        alert(d.message);
      } catch (e) {
        showError('Request failed: ' + e.message);
      }
    }
  }, 1000);
});

refreshStatus();
refreshDocker();
setInterval(refreshStatus, 5000);
setInterval(refreshDocker, 8000);
</script>

</body>
</html>
